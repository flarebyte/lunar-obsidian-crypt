name: CI
on:
  - push
jobs:
  build:
    name: Build, lint, and test on Node ${{ matrix.node }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node:
          - 18.x
        os:
          - macOS-latest
          - ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Use Node ${{ matrix.node }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
      - name: Installation
        run: yarn install
      - name: Create temp folder
        run: mkdir temp
      - name: Run zest unit tests
        run: |
          if [ -d "spec" ]; then
            npx npx baldrick-broth@latest test spec
          else
            echo "No zest files. Skipping"
          fi
      - name: Run pest integration tests
        run: |
          if [ -d "pest-spec" ]; then
            npx npx baldrick-broth@latest test pest
          else
            echo "No pest files. Skipping"
          fi
      - name: Check pest report exists
        id: pest_report
        shell: bash
        run: |
          if compgen -G "report/*.pest.mocha.json" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        run: yarn build
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: (success() || failure()) && steps.pest_report.outputs.found == 'true'
        with:
          name: Pest
          path: report/*.pest.mocha.json
          reporter: mocha-json
